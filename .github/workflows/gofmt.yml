name: One-shot gofmt

on:
  push:
    branches: [feat/ecosystem-sync-v1]
    paths: [".github/workflows/gofmt.yml"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ecosystem-sync-v1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          gofmt -w .
          rm .github/workflows/gofmt.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format portable agent contracts"
          git push origin HEAD:feat/ecosystem-sync-v1
